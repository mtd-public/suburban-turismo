name: Deploy (GitHub Pages)

# Pushes to main publish the art test at https://mtd-public.github.io/suburban-turismo/ (store-smash's flow).
# Pages must use "GitHub Actions" as its source (repo → Settings → Pages); the configure step tries to switch it on.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble site (only what the page serves)
        run: |
          mkdir -p _site
          cp -r index.html css js touch-zoom-guard _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
